name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run test suite
        run: composer test

      - name: Run static analysis and style check
        run: composer run check:all

      - name: Build standalone single-file distribution
        run: php bin/build.php

      - name: Verify build artifact exists
        run: test -f dist/fast-php-logger.php

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fast-php-logger.php
          generate_release_notes: true
